<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock-up: Twitch panels</title>
<!--
  The images of the Twitch panels (html-mockups skill): À propos, Exile Market, Règles du chat,
  in the art direction of the scenes « Pause » and « Fin » (overlays/screens/): the black, the red
  of Exile Market, Manrope, a still rain over a floor in perspective.

  Twitch scales a panel image to 320 px wide (at most 320 × 600 px and 1 MB, docs/texts/twitch-channel.md),
  so each frame is drawn 320 px wide; "Zoom" only enlarges it on this page. The rain is drawn from a
  seed per proposal, so that an image stays the same from one reload to the next.

  Serve the repository root, then open http://127.0.0.1:8790/docs/mockups/panels.html :
    python3 .claude/skills/html-mockups/assets/serve.py 8790
-->
<style>
  @font-face { font-family: "Manrope"; font-weight: 800; font-display: block; src: url("../../assets/fonts/manrope-extrabold.ttf") format("truetype"); }
  @font-face { font-family: "Manrope"; font-weight: 600; font-display: block; src: url("../../assets/fonts/manrope-semibold.ttf") format("truetype"); }

  /* The page around the frames. */
  body { margin: 0; background: #2a2d31; color: #e9ecef; font: 14px/1.4 system-ui, sans-serif; }
  .page-tabs { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 16px; background: #1b1d20; border-bottom: 1px solid #3a3f45; }
  .page-tabs .group { display: flex; align-items: center; gap: 4px; }
  .page-tabs .group > span { margin-right: 4px; color: #adb5bd; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .page-tabs button { padding: 4px 10px; border: 1px solid #3a3f45; border-radius: 4px; background: #24272b; color: #dee2e6; font: inherit; cursor: pointer; }
  .page-tabs button[aria-pressed="true"] { background: #e9ecef; color: #1b1d20; border-color: #e9ecef; }
  .page-tabs input[type="range"] { width: 120px; accent-color: #e9ecef; }
  .page-tabs output { min-width: 4ch; color: #dee2e6; font-variant-numeric: tabular-nums; }
  .page-tabs select { padding: 3px 4px; border: 1px solid #3a3f45; border-radius: 4px; background: #24272b; color: #dee2e6; font: inherit; cursor: pointer; }
  .page-header { padding: 18px 16px 0; }
  .page-header h1 { margin: 0 0 4px; font-size: 20px; }
  .page-header p { margin: 0; max-width: 820px; color: #adb5bd; }
  .page-section { padding: 8px 16px 24px; }
  .page-section h2 { font-size: 15px; color: #adb5bd; font-weight: 600; }
  .page-row { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
  .page-slot > span { display: block; margin-bottom: 6px; color: #adb5bd; font-size: 12px; max-width: calc(320px * var(--zoom)); }
  .page-slot > span b { color: #fff; }
  /* Twitch's channel page around the panel, to judge the image in its place. */
  .page-twitch { padding: 10px; background: #0e0e10; }
  .page-warning { margin: 0; padding: 10px 16px; background: #8a6a10; color: #fff; }

  /* Tokens of overlays/screens/screens.css. */
  :root {
    --bg: #0a0a0a; --text: #ffffff; --signal: #e5383b;
    --sky: radial-gradient(ellipse 120% 90% at 50% 0%, #170d0e 0%, #0a0a0a 65%);
    --font-title: "Manrope", sans-serif; --tracking-title: -0.045em;
  }

  /* A panel image: 320 px wide, its height set by the slider. */
  .pnl-frame { position: relative; width: 320px; height: var(--height); overflow: hidden; background: var(--sky); color: var(--text); zoom: var(--zoom); }
  .pnl-rain { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pnl-layer { position: absolute; inset: 0; display: flex; align-items: center; }
  .pnl-title { margin: 0; font-family: var(--font-title); font-weight: 800; font-size: var(--title-size); letter-spacing: var(--tracking-title); line-height: 1; white-space: nowrap; text-shadow: 0 0 14px #000, 0 0 4px #000; }
  .pnl-title .is-signal { color: var(--signal); }
  :root[data-title="none"] .pnl-title { display: none; }

  /* Layouts. */
  .pnl-side { gap: 16px; padding: 0 22px; }
  .pnl-side .pnl-art { flex: none; width: calc(var(--height) * 0.62); height: calc(var(--height) * 0.62); }
  :root[data-title="none"] .pnl-side { justify-content: center; }
  .pnl-center { justify-content: center; }
  .pnl-watermark { position: absolute; left: 50%; top: 50%; width: calc(var(--height) * 1.5); height: calc(var(--height) * 1.5); transform: translate(-50%, -50%) rotate(-8deg); opacity: .16; }
  .pnl-glow { padding-left: 22px; }
  .pnl-glow .pnl-art { position: absolute; right: calc(var(--height) * -0.28); top: 50%; width: calc(var(--height) * 1.25); height: calc(var(--height) * 1.25); transform: translateY(-50%); filter: drop-shadow(0 0 10px #e5383bcc) drop-shadow(0 0 26px #e5383b66); opacity: .9; }
  .pnl-glow .pnl-title { position: relative; }
  .pnl-full .pnl-art { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pnl-full .pnl-title { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); }

  /* The storm of proposal 9 applied to every panel, with no title: the drawing in the middle,
     a red bolt over it or two bolts around it. */
  .pnl-struck { position: relative; width: calc(var(--height) * 0.78); height: calc(var(--height) * 0.78); }
  .pnl-struck.is-logo { width: calc(var(--height) * 0.78 * var(--logo-scale)); height: calc(var(--height) * 0.78 * var(--logo-scale)); }
  .pnl-struck > * { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pnl-struck .pnl-logo.is-sylent { inset: 6%; }
  .pnl-struck .pnl-logo.is-exile-market { inset: 4%; }
  .pnl-struck .pnl-logo.is-white { --logo-color: #fff; }
  .pnl-bolts { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  /* The logos, tinted by their background through their alpha. */
  .pnl-logo { background: var(--logo-color, #fff); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
  .pnl-logo.is-sylent { --logo: url("../../assets/logos/sylent-emblem.png"); }
  .pnl-logo.is-exile-market { --logo: url("../../assets/logos/exile-market-emblem.svg"); --logo-color: var(--signal); }

  /* The drawings: lines in white, the signal in red. */
  .pnl-art svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .pnl-art .line { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .pnl-art .thin { fill: none; stroke: #fff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: .7; }
  .pnl-art .red { fill: none; stroke: var(--signal); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .pnl-art .fill-red { fill: var(--signal); }
  .pnl-art .fill-white { fill: #fff; }
  .pnl-art .is-glow { filter: drop-shadow(0 0 4px #e5383b) drop-shadow(0 0 12px #e5383b99); }
  .pnl-art .is-shadow { filter: drop-shadow(0 0 6px #000); }
</style>
</head>
<body>
<p class="page-warning" id="file-warning" hidden>Opened as a file: serve the repository root (see the comment at the top of this page) so that the fonts and the logos load.</p>
<nav class="page-tabs" id="tabs" aria-label="Variants"></nav>
<main id="sheet"></main>
<script src="../texts/twitch-panels.js"></script>
<script>
  const VARIANTS = {
    zoom: { label: "Zoom", select: true, variable: "--zoom", options: { "1": "Real size (320 px)", "2": "×2" }, fallback: "2" },
    title: { label: "Title on the image", options: { with: "With", none: "Without" }, fallback: "none" },
    height: { label: "Height", range: { min: 80, max: 200, step: 4 }, variable: "--height", unit: "px", fallback: "120" },
    logoScale: { label: "Logos (15, 16)", range: { min: 0.4, max: 1, step: 0.05 }, variable: "--logo-scale", fallback: "0.55" },
    titleSize: { label: "Title size", range: { min: 20, max: 40, step: 1 }, variable: "--title-size", unit: "px", fallback: "30" },
    density: { label: "Rain density", range: { min: 0, max: 2, step: 0.1 }, unit: "×", fallback: "0" },
    red: { label: "Red drops", range: { min: 0, max: 0.5, step: 0.05 }, fallback: "0.15" },
    grid: { label: "Floor", range: { min: 0, max: 1, step: 0.05 }, fallback: "0.3" },
  };

  const params = new URLSearchParams(location.search);
  const accepts = (variant, value) => variant.range
    ? value !== null && Number(value) >= variant.range.min && Number(value) <= variant.range.max
    : value in variant.options;
  const chosen = Object.fromEntries(Object.entries(VARIANTS).map(([key, variant]) =>
    [key, accepts(variant, params.get(key)) ? params.get(key) : variant.fallback]));

  const T = window.PANEL_TEXTS;
  // The last word of a title of several words in red.
  const panelTitle = text => {
    const words = text.split(" ");
    const html = words.length > 1 ? `${words.slice(0, -1).join(" ")} <span class="is-signal">${words.at(-1)}</span>` : text;
    return `<h3 class="pnl-title">${html}</h3>`;
  };
  const svg = (body, viewBox = "0 0 100 100") => `<svg viewBox="${viewBox}" aria-hidden="true">${body}</svg>`;

  // The drawings of « Règles du chat », from calm to explosive.
  const BUBBLE = "M20 24h60a9 9 0 0 1 9 9v30a9 9 0 0 1-9 9H46L30 86V72H20a9 9 0 0 1-9-9V33a9 9 0 0 1 9-9z";
  const DRAWINGS = {
    bubble: svg(`<path class="line" d="${BUBBLE}"/>
      <circle class="fill-white" cx="34" cy="48" r="4.5"/><circle class="fill-white" cx="50" cy="48" r="4.5"/><circle class="fill-red" cx="66" cy="48" r="4.5"/>`),
    shield: svg(`<path class="line" d="M50 10 L84 22 V46 C84 68 70 82 50 92 C30 82 16 68 16 46 V22 Z"/>
      <path class="red" d="M35 50 L46 61 L67 38"/>`),
    umbrella: svg(`<path class="line" d="M10 50 Q50 2 90 50 Q80 41 70 50 Q60 41 50 50 Q40 41 30 50 Q20 41 10 50 Z"/>
      <path class="line" d="M50 50 V82 q0 8 -8 8 q-7 0 -7 -7"/>
      <path class="red" d="M6 64 v8 M18 70 v8 M82 66 v8 M94 58 v8"/>
      <path class="thin" d="M30 64 v6 M70 70 v6"/>`),
    scroll: svg(`<path class="line" d="M24 22 H76 V78 H24 Z"/>
      <path class="line" d="M18 14 h64 a6 6 0 0 1 0 12 h-64 a6 6 0 0 1 0 -12 z"/>
      <path class="line" d="M18 74 h64 a6 6 0 0 1 0 12 h-64 a6 6 0 0 1 0 -12 z"/>
      <path class="thin" d="M33 38 H67 M33 48 H63 M33 58 H55"/>
      <circle class="fill-red is-glow" cx="66" cy="64" r="7.5"/>`),
    struck: svg(`<path class="line" d="${BUBBLE}"/>
      <path class="thin" d="M52 30 L46 42 L54 48 M60 66 L66 58"/>
      <path class="fill-red is-glow" d="M64 -6 L40 46 H56 L34 104 L76 34 H58 L78 -6 Z"/>`, "0 -10 100 120"),
    // Drawn on x 140–300, then shrunk into the right of the image, beside the title.
    storm: svg(`<g transform="translate(222 22) scale(0.6) translate(-140 0)"><g class="is-shadow">
        <path class="line" d="M150 44 Q205 -2 260 44 Q246 35 232 44 Q219 35 205 44 Q191 35 178 44 Q164 35 150 44 Z"/>
        <path class="line" d="M205 44 V96"/>
        <path class="line" d="M176 70 h34 a6 6 0 0 1 6 6 v14 a6 6 0 0 1 -6 6 h-18 l-9 8 v-8 h-7 a6 6 0 0 1 -6 -6 v-14 a6 6 0 0 1 6 -6 z"/>
        <path class="line" d="M226 76 h28 a6 6 0 0 1 6 6 v12 a6 6 0 0 1 -6 6 h-6 v7 l-8 -7 h-14 a6 6 0 0 1 -6 -6 v-12 a6 6 0 0 1 6 -6 z"/>
      </g>
      <path class="fill-red is-glow" d="M288 -4 L272 34 H283 L266 76 L298 26 H286 L300 -4 Z"/>
      <path class="red" d="M140 54 v10 M168 50 v8 M248 52 v10 M272 60 v8 M300 70 v10"/></g>`, "0 0 320 120"),
  };

  // Every proposal, numbered once across the page: [number, name, description, html, seed, storm].
  const logo = kind => `<div class="pnl-art pnl-logo is-${kind}"></div>`;
  // Proposal 9 without its title, for every panel: one bolt across the drawing, or two around it.
  const BOLT = svg(`<path class="fill-red is-glow" d="M64 -6 L40 46 H56 L34 104 L76 34 H58 L78 -6 Z"/>`, "0 -10 100 120");
  const struck = inner => `<div class="pnl-layer pnl-center"><div class="pnl-struck">${inner}<div class="pnl-art">${BOLT}</div></div></div>`;
  const plain = inner => `<div class="pnl-layer pnl-center"><div class="pnl-struck is-logo">${inner}</div></div>`;
  const framed = inner => `<div class="pnl-layer pnl-center pnl-art"><svg class="pnl-bolts" viewBox="0 0 320 120" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
      <path class="fill-red is-glow" d="M96 -4 L84 40 H93 L78 92 L104 32 H95 L106 -4 Z"/>
      <path class="fill-red is-glow" d="M232 28 L218 74 H228 L214 124 L242 62 H232 L244 28 Z"/></svg>
    <div class="pnl-struck">${inner}</div></div>`;
  const SECTIONS = [
    ["Your choice: 9 for every panel, without title nor drops; no bolt on the logos (11 to 14 set aside)", [
      [9, "Bulle foudroyée", "Proposal 9, centered, without its title.", struck(`<div class="pnl-art">${DRAWINGS.struck}</div>`.replace(/<path class="fill-red is-glow"[^>]*>/, "")), true],
      [15, "À propos · sans éclair", "The Sylent emblem in white, alone in the storm of 9.", plain(`<div class="pnl-logo is-sylent"></div>`), true],
      [16, "Exile Market · sans éclair", "The emblem in its red, alone in the storm of 9.", plain(`<div class="pnl-logo is-exile-market"></div>`), true],
    ]],
    ["À propos: the Sylent logo", [
      [1, "Logo à gauche", "The Sylent emblem in white, the title beside it.", `<div class="pnl-layer pnl-side">${logo("sylent")}${panelTitle(T.about.title)}</div>`],
      [2, "Filigrane", "The emblem large and faint behind the rain, the title centered over it.", `<div class="pnl-watermark pnl-logo is-sylent"></div><div class="pnl-layer pnl-center">${panelTitle(T.about.title)}</div>`],
    ]],
    ["Exile Market: its emblem", [
      [3, "Emblème à gauche", "The red emblem of the application, the title beside it.", `<div class="pnl-layer pnl-side">${logo("exile-market")}${panelTitle(T.exileMarket.title)}</div>`],
      [4, "Emblème lumineux", "The emblem large on the right, cut by the edge, glowing red; the title on the left.", `<div class="pnl-layer pnl-glow">${logo("exile-market")}${panelTitle(T.exileMarket.title)}</div>`],
    ]],
    ["Règles du chat: normal temperature", [
      [5, "Bulle", "A chat bubble in lines, its last dot red.", `<div class="pnl-layer pnl-side"><div class="pnl-art">${DRAWINGS.bubble}</div>${panelTitle(T.rules.title)}</div>`],
      [6, "Bouclier", "A shield with a red tick: the chat is a safe place.", `<div class="pnl-layer pnl-side"><div class="pnl-art">${DRAWINGS.shield}</div>${panelTitle(T.rules.title)}</div>`],
    ]],
    ["Règles du chat: high temperature", [
      [7, "Parapluie", "An umbrella that keeps the chat dry, red drops around it: « on reste chill ».", `<div class="pnl-layer pnl-side"><div class="pnl-art">${DRAWINGS.umbrella}</div>${panelTitle(T.rules.title)}</div>`],
      [8, "Parchemin", "A scroll of rules sealed with glowing red wax.", `<div class="pnl-layer pnl-side"><div class="pnl-art">${DRAWINGS.scroll}</div>${panelTitle(T.rules.title)}</div>`],
    ]],
    ["Règles du chat: explosive temperature", [
      [9, "Bulle foudroyée", "A red lightning bolt strikes the bubble and cracks it, in a storm.", `<div class="pnl-layer pnl-side"><div class="pnl-art">${DRAWINGS.struck}</div>${panelTitle(T.rules.title)}</div>`, true],
      [10, "Tempête sur le chat", "The whole image: a storm, a lightning bolt on the right, two bubbles sheltered under an umbrella.", `<div class="pnl-layer pnl-full"><div class="pnl-art">${DRAWINGS.storm}</div>${panelTitle(T.rules.title)}</div>`, true],
    ]],
  ];

  // A small seeded random, so that each rain is the same at every reload.
  function seeded(seed) {
    let state = seed * 2654435761 >>> 0;
    return () => {
      state = (state + 0x6d2b79f5) >>> 0;
      let value = Math.imul(state ^ (state >>> 15), 1 | state);
      value = (value + Math.imul(value ^ (value >>> 7), 61 | value)) ^ value;
      return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
    };
  }

  // The still rain of overlays/screens/rain.js, at the scale of a panel.
  function drawRain(canvas, seed, storm) {
    const frame = canvas.parentElement;
    const W = 320;
    const H = Number(chosen.height);
    const scale = (window.devicePixelRatio || 1) * Number(chosen.zoom);
    canvas.width = W * scale;
    canvas.height = H * scale;
    const context = canvas.getContext("2d");
    context.setTransform(scale, 0, 0, scale, 0, 0);
    const random = seeded(seed);
    const between = (low, high) => low + random() * (high - low);
    const RED = "229, 56, 59";
    const WHITE = "210, 218, 228";
    const horizon = H * 0.68;

    if (storm) {
      // A red flash from the top right, and a faint bolt far away.
      const flash = context.createRadialGradient(W * 0.85, 0, 0, W * 0.85, 0, W * 0.9);
      flash.addColorStop(0, "rgba(229, 56, 59, 0.28)");
      flash.addColorStop(1, "rgba(229, 56, 59, 0)");
      context.fillStyle = flash;
      context.fillRect(0, 0, W, H);
    }

    // The floor: a grid in perspective under the horizon, and a faint red line on it.
    const grid = Number(chosen.grid);
    if (grid > 0) {
      const fade = context.createLinearGradient(0, horizon, 0, H);
      fade.addColorStop(0, "rgba(255, 255, 255, 0)");
      fade.addColorStop(1, `rgba(255, 255, 255, ${0.35 * grid})`);
      context.strokeStyle = fade;
      context.lineWidth = 0.6;
      context.beginPath();
      for (let column = -24; column <= 24; column += 1) {
        context.moveTo(W / 2, horizon);
        context.lineTo(W / 2 + column * 34, H * 1.6);
      }
      for (let line = 0; line < 30; line += 1) {
        const y = horizon + (H - horizon) / (0.8 + line * 0.5);
        if (y > H + 2) continue;
        context.moveTo(0, y);
        context.lineTo(W, y);
      }
      context.stroke();
      const line = context.createLinearGradient(0, 0, W, 0);
      line.addColorStop(0, "rgba(229, 56, 59, 0)");
      line.addColorStop(0.5, `rgba(229, 56, 59, ${storm ? 0.8 : 0.45})`);
      line.addColorStop(1, "rgba(229, 56, 59, 0)");
      context.fillStyle = line;
      context.fillRect(0, horizon - 0.5, W, 1);
    }

    // The drops: far ones short and faint, landing near the horizon; near ones at the bottom.
    const count = Math.round(W * H * 0.0042 * Number(chosen.density) * (storm ? 1.7 : 1));
    context.lineCap = "round";
    for (let index = 0; index < count; index += 1) {
      const depth = 0.35 + random() * 0.65;
      const ground = horizon + (H - horizon) * Math.pow((depth - 0.35) / 0.65, 1.6);
      const red = random() < Number(chosen.red);
      const alpha = between(0.12, 0.46) * (0.5 + depth * 0.5) * (storm ? 1.3 : 1);
      const x = random() * W;
      const length = between(7, 14) * depth;
      const y = random() * (ground + length);
      if (y - length > ground) continue;
      context.strokeStyle = `rgba(${red ? RED : WHITE}, ${Math.min(1, alpha * (red ? 1.7 : 1))})`;
      context.lineWidth = between(0.5, 1) * depth;
      context.beginPath();
      context.moveTo(x, Math.min(y, ground));
      context.lineTo(x, y - length);
      context.stroke();
      // Now and then, a flat ring where a drop lands.
      if (random() < 0.08) {
        context.strokeStyle = `rgba(${red ? RED : WHITE}, ${alpha})`;
        context.lineWidth = 0.5;
        context.beginPath();
        context.ellipse(x, ground, 3 + 7 * depth, (3 + 7 * depth) * 0.22, 0, 0, Math.PI * 2);
        context.stroke();
      }
    }
  }

  function drawAll() {
    for (const canvas of document.querySelectorAll(".pnl-rain")) {
      drawRain(canvas, Number(canvas.dataset.seed), canvas.dataset.storm === "true");
    }
  }

  function applyVariables() {
    for (const [key, variant] of Object.entries(VARIANTS)) {
      if (variant.variable) document.documentElement.style.setProperty(variant.variable, chosen[key] + (variant.unit === "px" ? "px" : ""));
    }
  }
  const keepInAddress = () => history.replaceState(null, "", "?" + new URLSearchParams(chosen));

  function render() {
    for (const key of Object.keys(VARIANTS)) document.documentElement.dataset[key] = chosen[key];
    applyVariables();
    document.getElementById("tabs").innerHTML = Object.entries(VARIANTS).map(([key, variant]) => variant.range
      ? `<label class="group"><span>${variant.label}</span><input type="range" data-variant="${key}" min="${variant.range.min}" max="${variant.range.max}" step="${variant.range.step}" value="${chosen[key]}"><output>${chosen[key]}${variant.unit ?? ""}</output></label>`
      : variant.select
      ? `<label class="group"><span>${variant.label}</span><select data-variant="${key}">${Object.entries(variant.options).map(([value, label]) =>
        `<option value="${value}" ${chosen[key] === value ? "selected" : ""}>${label}</option>`).join("")}</select></label>`
      : `<div class="group"><span>${variant.label}</span>${Object.entries(variant.options).map(([value, label]) =>
        `<button type="button" data-variant="${key}" data-value="${value}" aria-pressed="${chosen[key] === value}">${label}</button>`).join("")}</div>`).join("");
    document.getElementById("sheet").innerHTML = `
      <header class="page-header"><h1>Twitch panels</h1><p>The images of the three panels, 320 px wide as Twitch shows them, over the dark page of a Twitch channel. Proposals are numbered once across the page: give their number. The sliders apply to every image, so that the three panels match.</p></header>
      ${SECTIONS.map(([title, slots]) => `<section class="page-section"><h2>${title}</h2><div class="page-row">${
        slots.map(([number, name, text, html, storm]) => `<div class="page-slot"><span><b>${number} · ${name}</b> — ${text}</span><div class="page-twitch"><div class="pnl-frame" data-number="${number}"><canvas class="pnl-rain" data-seed="${number}" data-storm="${Boolean(storm)}"></canvas>${html}</div></div></div>`).join("")}</div></section>`).join("")}`;
    drawAll();
  }

  document.getElementById("tabs").addEventListener("click", event => {
    const { variant, value } = event.target.dataset;
    if (!variant || value === undefined) return;
    chosen[variant] = value;
    keepInAddress();
    render();
  });
  document.getElementById("tabs").addEventListener("input", event => {
    const { variant } = event.target.dataset;
    if (!variant) return;
    chosen[variant] = event.target.value;
    if (VARIANTS[variant].range) event.target.nextElementSibling.value = chosen[variant] + (VARIANTS[variant].unit ?? "");
    keepInAddress();
    applyVariables();
    drawAll();
  });
  document.getElementById("file-warning").hidden = location.protocol !== "file:";
  document.fonts.load("800 30px Manrope").finally(render);
</script>
</body>
</html>
