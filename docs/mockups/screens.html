<title>Mock-up: Pause and Fin</title>
<!--
  Mock-up of the full-screen scenes « Pause » and « Fin » (html-mockups skill), in the art
  direction of sylent.art and exile-market.sylent.tools: neutral blacks, white, sharp corners,
  Manrope 800 with tight tracking, the red of Exile Market as the only signal color, the
  subtitle in Cormorant Garamond italic.

  Series 3 (2026-11-15): rain behind the texts, dark like Path of Exile. Series 1 (styles 1 to 4)
  and 2 (5 to 12) were set aside by the owner the same day; the red and the motion were kept,
  and the lightning of style 18 that reveals a giant word.

  Chosen by the owner on 2026-11-15, and built in overlays/screens/: rain 15 « Pluie de sang »,
  straight drops, density ×2, speed ×0.6, the grid in perspective at 0.3, lightning now and then,
  white or red, without shaking. The other rains stay here for comparison.

  Each scene is drawn at the size of the OBS canvas (2560 × 1440) and scaled down in the page.
  The rain is drawn on a canvas, as the overlay would in OBS's browser.
  The texts come from overlays/screens/texts.js, the same file as the overlay.

  Serve the repository root without cache:
    python3 .claude/skills/html-mockups/assets/serve.py 8790
  then open http://127.0.0.1:8790/docs/mockups/screens.html
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Manrope:wght@500;600;700;800&display=block">
<style>
  /* The page around the frames: neutral, so that it doesn't compete with the styles. */
  body { margin: 0; background: #2a2d31; color: #e9ecef; font: 14px/1.4 system-ui, sans-serif; }
  .page-tabs { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 16px; background: #1b1d20; border-bottom: 1px solid #3a3f45; }
  .page-tabs .group { display: flex; align-items: center; gap: 4px; }
  .page-tabs .group > span { margin-right: 4px; color: #adb5bd; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .page-tabs button { padding: 4px 10px; border: 1px solid #3a3f45; border-radius: 4px; background: #24272b; color: #dee2e6; font: inherit; cursor: pointer; }
  .page-tabs button[aria-pressed="true"] { background: #e9ecef; color: #1b1d20; border-color: #e9ecef; }
  .page-tabs select { padding: 3px 4px; border: 1px solid #3a3f45; border-radius: 4px; background: #24272b; color: #dee2e6; font: inherit; cursor: pointer; }
  .page-tabs input[type="range"] { width: 120px; accent-color: #e9ecef; }
  .page-tabs output { min-width: 4ch; color: #dee2e6; font-variant-numeric: tabular-nums; }
  .page-header { padding: 18px 16px 0; }
  .page-header h1 { margin: 0 0 4px; font-size: 20px; }
  .page-header p { margin: 0; max-width: 860px; color: #adb5bd; }
  .page-section { padding: 8px 16px 24px; }
  .page-section h2 { font-size: 15px; color: #adb5bd; font-weight: 600; }
  .page-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .page-slot > span { display: block; margin-bottom: 6px; color: #adb5bd; font-size: 12px; }
  .page-warning { margin: 0; padding: 10px 16px; background: #8a6a10; color: #fff; }

  /* A frame: the canvas at its real size, scaled down to the chosen viewing size. */
  .page-frame { width: calc(2560px * var(--view)); height: calc(1440px * var(--view)); overflow: hidden; box-shadow: 0 8px 30px #0008; }
  .page-frame > .ovl-screen { transform: scale(var(--view)); transform-origin: 0 0; }

  /* Tokens of the art direction (sylent.art, exile-market.sylent.tools). */
  :root {
    --bg: #0a0a0a; --text: #ffffff; --weak: #a3a3a3; --faint: #858585;
    --signal: #e5383b;
    --font-title: "Manrope", sans-serif; --font-text: "Manrope", sans-serif;
    --font-subtitle: "Cormorant Garamond", serif; --subtitle-style: italic; --subtitle-weight: 500;
    --tracking-title: -0.045em;
    --title-size: 150px; --subtitle-size: 80px; --footer-size: 26px;
    --sky: radial-gradient(ellipse 120% 80% at 50% 0%, #15171b 0%, #0a0a0a 60%);
    --mist: linear-gradient(0deg, #ffffff0c 0%, transparent 28%);
  }
  :root[data-theme="blood"] { --sky: radial-gradient(ellipse 120% 80% at 50% 0%, #170d0e 0%, #0a0a0a 60%); --mist: linear-gradient(0deg, #e5383b14 0%, transparent 30%); }
  :root[data-theme="pane"] { --sky: #070707; --mist: none; }
  :root[data-theme="deluge"] { --sky: radial-gradient(ellipse 120% 80% at 50% 0%, #1d0b0c 0%, #0a0a0a 65%); --mist: linear-gradient(0deg, #e5383b1f 0%, transparent 35%); }
  :root:not([data-floor="none"]) { --mist: linear-gradient(0deg, transparent 0%, transparent 100%); }
  :root[data-layout="left"] { --align: flex-start; --text-align: left; }
  :root[data-layout="center"] { --align: center; --text-align: center; }

  /* Components: the classes of the overlay start with `ovl-`, the states with `is-`. */
  .ovl-screen { position: relative; box-sizing: border-box; width: 2560px; height: 1440px; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font-text); }
  .ovl-stage { position: absolute; inset: 0; background: var(--sky); }
  .ovl-stage::after { content: ""; position: absolute; inset: 0; background: var(--mist); pointer-events: none; }
  .ovl-rain { position: absolute; inset: 0; width: 2560px; height: 1440px; }
  .ovl-bokeh { display: none; }
  :root[data-theme="pane"] .ovl-bokeh { display: block; position: absolute; inset: -60px; filter: blur(46px); }
  .ovl-bokeh i { position: absolute; border-radius: 50%; }
  .ovl-content { position: relative; z-index: 2; box-sizing: border-box; height: 100%; padding: 0 260px; display: flex; flex-direction: column; justify-content: center; align-items: var(--align); text-align: var(--text-align); }
  /* A shade behind the text, so that it reads over the heaviest rain. */
  .ovl-content::before { content: ""; position: absolute; z-index: -1; left: 0; right: 0; top: var(--shade-y, 50%); height: 900px; transform: translateY(-50%); background: radial-gradient(ellipse 50% 45% at var(--shade-x, 50%) 50%, #0a0a0ab3 0%, transparent 100%); }
  :root[data-layout="left"] .ovl-content::before { --shade-x: 30%; }
  .ovl-title { margin: 0; max-width: 2040px; font-family: var(--font-title); font-weight: 800; font-size: var(--title-size); letter-spacing: var(--tracking-title); line-height: .98; text-wrap: balance; text-shadow: 0 0 40px #000; }
  .ovl-title .is-signal { color: var(--signal); }
  /* The subtitle of exile-market.sylent.tools: Cormorant Garamond italic 500, one size larger, since it draws small. */
  .ovl-subtitle { margin: 36px 0 0; font-family: var(--font-subtitle); font-style: var(--subtitle-style); font-weight: var(--subtitle-weight); font-size: var(--subtitle-size); color: var(--weak); text-shadow: 0 0 30px #000; }
  .ovl-footer::before { content: ""; position: absolute; z-index: -1; left: 50%; top: 50%; width: 2200px; height: 260px; transform: translate(-50%, -50%); background: radial-gradient(ellipse 50% 50% at 50% 50%, #0a0a0ad9 0%, transparent 100%); }
  .ovl-footer { position: absolute; z-index: 2; left: 260px; right: 260px; bottom: 56px; margin: 0; font-weight: 500; font-size: 24px; color: var(--faint); text-align: var(--text-align); text-shadow: 0 0 12px #000; }
  .ovl-footer-link { margin: 0 0 10px; font-weight: 700; font-size: var(--footer-size); color: var(--signal); }
  .ovl-footer-note { margin: 0; }
</style>

<body>
<p class="page-warning" id="file-warning" hidden>Opened as a file: serve the repository root (see the comment at the top of this page) so that the texts of overlays/ load.</p>
<nav class="page-tabs" id="tabs" aria-label="Styles and variants"></nav>
<main id="sheet"></main>
<script src="../../overlays/screens/texts.js"></script>
<script>
  // Numbered after the first two series (1 to 12, set aside by the owner on 2026-11-15).
  const THEMES = {
    drizzle: { title: "13 · Bruine", text: "A fine, sparse rain, a mist at the bottom. Calm, for a long pause." },
    shower: { title: "14 · Averse", text: "A steady rain in three depths (the far drops slower and fainter), small splashes on the ground." },
    blood: { title: "15 · Pluie de sang", text: "One drop in six falls red, the splashes of the red ones glow, a red mist rises from the ground." },
    pane: { title: "16 · Vitre", text: "Rain on a window, drops that run down and leave a trail, blurred lights behind the glass, one in four red." },
    storm: { title: "17 · Orage", text: "A heavy, dense rain, mostly white." },
    deluge: { title: "18 · Déluge écarlate", text: "A torrent where most drops are red." },
  };
  const VARIANTS = {
    theme: { label: "Rain", options: Object.fromEntries(Object.entries(THEMES).map(([key, theme]) => [key, theme.title])), fallback: "blood" },
    grid: { label: "Grid opacity", range: { min: 0.1, max: 1, step: 0.05 }, fallback: "0.3" },
    layout: { label: "Text", options: { center: "Centered", left: "Left" }, fallback: "center" },
    motion: { label: "Motion", options: { live: "Live", still: "Still" }, fallback: "live" },
    density: { label: "Rain density", range: { min: 0.2, max: 2, step: 0.1 }, unit: "×", fallback: "2" },
    speed: { label: "Rain speed", range: { min: 0.2, max: 2, step: 0.1 }, unit: "×", fallback: "0.6" },
    view: { label: "Viewing size", select: true, variable: "--view", options: { "0.4": "Overview (40 %)", "0.625": "Stream 1600 × 900", "0.25": "Phone (25 %)", "1": "Canvas 2560 × 1440" }, fallback: "0.4" },
  };

  const params = new URLSearchParams(location.search);
  const accepts = (variant, value) => variant.range
    ? value !== null && Number(value) >= variant.range.min && Number(value) <= variant.range.max
    : value in variant.options;
  const chosen = Object.fromEntries(Object.entries(VARIANTS).map(([key, variant]) =>
    [key, accepts(variant, params.get(key)) ? params.get(key) : variant.fallback]));

  const T = window.TEXTS ?? { pause: {}, end: {} };
  const escape = text => (text ?? "").replace(/[&<>]/g, character => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[character]);
  // The last word of a title in the signal color, with the punctuation that follows it (« pause », « regardé ! »).
  function withSignalEnd(text) {
    const safe = escape(text);
    const cut = safe.lastIndexOf(" ", safe.length - 3) + 1;
    return `${safe.slice(0, cut)}<span class="is-signal">${safe.slice(cut)}</span>`;
  }

  // ---------- The rain ----------
  // Each style is a set of numbers; the engine is the same. Speeds in pixels per second.
  const RAIN = {
    drizzle: { count: 320, angle: 0.12, speed: [520, 760], length: [16, 34], width: [1, 1.6], alpha: [0.14, 0.36], red: 0, splash: false },
    shower: { count: 950, angle: 0.04, speed: [1300, 2000], length: [40, 84], width: [1, 2.2], alpha: [0.1, 0.4], red: 0, splash: true },
    blood: { count: 850, angle: 0.07, speed: [1200, 1800], length: [40, 76], width: [1.2, 2.4], alpha: [0.12, 0.46], red: 1 / 6, splash: true },
    pane: { pane: true, still: 260, runners: 34, red: 0.25 },
    storm: { count: 1900, angle: 0.3, speed: [2300, 3300], length: [70, 130], width: [1.2, 2.6], alpha: [0.12, 0.5], red: 0.05, splash: true, gust: true },
    deluge: { count: 2700, angle: 0.16, speed: [2800, 4200], length: [90, 170], width: [1.5, 3], alpha: [0.18, 0.68], red: 0.55, splash: true, gust: true },
  };
  // Lightning, chosen by the owner on 2026-11-15: now and then, white or red at random, the screen still.
  const LIGHTNING = { every: [4, 9], colors: ["255, 255, 255", "229, 56, 59"] };
  const W = 2560, H = 1440;
  const HORIZON = 900;   // The line where the floor meets the sky, under the texts.
  const RED = "229, 56, 59", WHITE = "210, 218, 228";
  let generation = 0;

  // A random generator with a seed, so that both frames and every load start the same.
  function seeded(seed) {
    return () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  }
  const between = (random, [low, high]) => low + random() * (high - low);

  // The floor: a grid in perspective, its lines running to a vanishing point at the center of the horizon.
  // Depth z = 1 at the bottom of the screen; a line at depth z sits at HORIZON + (H - HORIZON) / z.
  function drawFloor(context, light) {
    const opacity = Number(chosen.grid);
    const fade = context.createLinearGradient(0, HORIZON, 0, H);
    fade.addColorStop(0, "rgba(255, 255, 255, 0)");
    fade.addColorStop(0.3, `rgba(255, 255, 255, ${(0.12 + light * 0.25) * opacity})`);
    fade.addColorStop(1, `rgba(255, 255, 255, ${(0.24 + light * 0.3) * opacity})`);
    context.strokeStyle = fade;
    context.lineWidth = 2;
    context.beginPath();
    const cell = 180;   // The width of a cell at the bottom of the screen.
    for (let column = -40; column <= 40; column += 1) {
      context.moveTo(W / 2, HORIZON);
      context.lineTo(W / 2 + column * cell * 2.2, H + (H - HORIZON) * 1.2);
    }
    const spacing = 0.5;   // Distance between two lines, in units of z.
    for (let line = 0; line < 60; line += 1) {
      const z = 0.8 + line * spacing;
      const y = HORIZON + (H - HORIZON) / z;
      if (y > H + 4) continue;
      context.moveTo(0, y);
      context.lineTo(W, y);
    }
    context.stroke();
    // A faint red line where the floor meets the sky.
    const horizon = context.createLinearGradient(0, 0, W, 0);
    horizon.addColorStop(0, "rgba(229, 56, 59, 0)");
    horizon.addColorStop(0.5, `rgba(229, 56, 59, ${0.35 + light * 0.5})`);
    horizon.addColorStop(1, "rgba(229, 56, 59, 0)");
    context.fillStyle = horizon;
    context.fillRect(0, HORIZON - 1, W, 2);
  }

  function startRain(canvas, word) {
    const config = RAIN[chosen.theme];
    const strikes = LIGHTNING;
    const floor = true;   // The grid in perspective, chosen by the owner on 2026-11-15, still.
    let color = strikes.colors[0];
    const context = canvas.getContext("2d");
    const random = seeded(7);
    const myGeneration = generation;
    const live = chosen.motion === "live";
    let flash = 0, nextStrike = between(random, strikes.every), bolt = null, time = 0;

    function strike() {
      flash = 1;
      color = strikes.colors[Math.floor(random() * strikes.colors.length)];
      // A bolt: a broken line from the top, with a few branches.
      const points = [[400 + random() * (W - 800), -20]];
      const end = floor ? HORIZON : H * (0.55 + random() * 0.25);
      while (points.at(-1)[1] < end) {
        const [x, y] = points.at(-1);
        points.push([x + (random() - 0.5) * 160, y + 40 + random() * 90]);
      }
      const branches = Array.from({ length: 3 }, () => {
        const start = points[2 + Math.floor(random() * (points.length - 3))];
        const branch = [start];
        for (let step = 0; step < 5; step += 1) branch.push([branch.at(-1)[0] + (random() - 0.4) * 140, branch.at(-1)[1] + 30 + random() * 60]);
        return branch;
      });
      bolt = [points, ...branches];
      nextStrike = time + between(random, strikes.every);
    }

    // The flash, the giant word and the bolt, under the rain.
    function drawLightning() {
      const light = flash > 0 ? flash * (0.6 + 0.4 * Math.sin(time * 60)) : 0;
      if (strikes && light > 0) {
        context.fillStyle = `rgba(${color}, ${light * 0.22})`;
        context.fillRect(0, 0, W, H);
        context.font = "800 760px Manrope";
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillStyle = `rgba(255, 255, 255, ${light * 0.1})`;
        context.fillText(word, W / 2, floor ? HORIZON - 380 : H / 2 + 40);
        if (bolt && flash > 0.55) {
          context.save();
          context.strokeStyle = `rgba(${color}, ${light})`;
          context.shadowColor = `rgba(${color}, 1)`;
          context.shadowBlur = 30;
          bolt.forEach((line, index) => {
            context.lineWidth = index === 0 ? 5 : 2;
            context.beginPath();
            line.forEach(([x, y], point) => (point ? context.lineTo(x, y) : context.moveTo(x, y)));
            context.stroke();
          });
          context.restore();
        }
      }
      return light;
    }
    function advanceTime(seconds) {
      time += seconds;
      if (time >= nextStrike) strike();
      // The flash fades with a flicker, then darkness.
      flash = Math.max(0, flash - seconds * 1.6);
    }

    if (config.pane) return startPane(canvas, config, random, myGeneration, live, { advanceTime, drawLightning, floor: () => drawFloor(context, 0) });

    // A pool of drops, twice the base count, so that the density slider only changes how many are drawn.
    // With a floor, a far drop lands near the horizon and a near one at the bottom of the screen.
    const makeDrop = (fromTop) => {
      const depth = 0.35 + random() * 0.65;
      const ground = floor
        ? HORIZON + (H - HORIZON) * Math.pow((depth - 0.35) / 0.65, 1.6) + random() * 30
        : H - (1 - depth) * 260 - random() * 40;
      return {
        x: random() * (W + H * 0.5) - H * 0.25,
        y: fromTop ? -random() * 200 : random() * ground,
        depth, ground,
        speed: between(random, config.speed) * depth,
        length: between(random, config.length) * depth,
        width: between(random, config.width) * depth,
        alpha: between(random, config.alpha) * (0.5 + depth * 0.5),
        red: random() < config.red,
      };
    };
    const drops = Array.from({ length: config.count * 2 }, () => makeDrop(false));
    const splashes = [];
    const ripples = [];

    function step(seconds) {
      advanceTime(seconds);
      const wind = 0;   // Straight drops, chosen by the owner on 2026-11-15.
      const active = Math.min(drops.length, Math.round(config.count * Number(chosen.density)));
      const speedFactor = Number(chosen.speed);
      for (let index = 0; index < active; index += 1) {
        const drop = drops[index];
        drop.y += drop.speed * speedFactor * seconds;
        drop.x += drop.speed * speedFactor * seconds * wind;
        if (drop.y > drop.ground) {
          // On the floor, a drop leaves a flat ring; elsewhere, two small splashes.
          if (floor && ripples.length < 500 && random() < 0.5) ripples.push({ x: drop.x, y: drop.ground, size: 10 + 50 * drop.depth, life: 0.5, red: drop.red, alpha: drop.alpha });
          else if (config.splash && drop.depth > 0.55 && splashes.length < 600) {
            for (let piece = 0; piece < 2; piece += 1) {
              splashes.push({ x: drop.x, y: drop.ground, vx: (random() - 0.5) * 260 * drop.depth, vy: -(120 + random() * 200) * drop.depth, life: 0.32, red: drop.red, alpha: drop.alpha });
            }
          }
          Object.assign(drop, makeDrop(true));
        }
      }
      for (let index = splashes.length - 1; index >= 0; index -= 1) {
        const piece = splashes[index];
        piece.life -= seconds;
        piece.vy += 1400 * seconds;
        piece.x += piece.vx * seconds;
        piece.y += piece.vy * seconds;
        if (piece.life <= 0) splashes.splice(index, 1);
      }
      for (let index = ripples.length - 1; index >= 0; index -= 1) {
        ripples[index].life -= seconds;
        if (ripples[index].life <= 0) ripples.splice(index, 1);
      }
      return { wind, active };
    }

    function draw({ wind, active }) {
      context.clearRect(0, 0, W, H);
      const light = drawLightning();
      drawFloor(context, light);
      for (const ring of ripples) {
        const grown = 1 - ring.life / 0.5;
        context.strokeStyle = `rgba(${ring.red ? RED : WHITE}, ${Math.min(1, ring.alpha * 1.8) * (1 - grown)})`;
        context.lineWidth = 1.5;
        context.beginPath();
        context.ellipse(ring.x, ring.y, ring.size * grown, ring.size * grown * 0.22, 0, 0, Math.PI * 2);
        context.stroke();
      }
      context.lineCap = "round";
      for (let index = 0; index < active; index += 1) {
        const drop = drops[index];
        const brighten = 1 + light * 1.5;
        context.strokeStyle = `rgba(${drop.red ? RED : WHITE}, ${Math.min(1, drop.alpha * brighten * (drop.red ? 1.6 : 1))})`;
        context.lineWidth = drop.width;
        context.beginPath();
        context.moveTo(drop.x, drop.y);
        context.lineTo(drop.x - drop.length * wind, drop.y - drop.length);
        context.stroke();
      }
      for (const piece of splashes) {
        context.fillStyle = `rgba(${piece.red ? RED : WHITE}, ${Math.min(1, piece.alpha * 2) * (piece.life / 0.32)})`;
        context.fillRect(piece.x, piece.y, 3, 3);
      }
    }

    // A still frame: run the rain for a while, with a flash, then draw once.
    if (!live) {
      for (let tick = 0; tick < 90; tick += 1) step(1 / 30);
      strike(); flash = 0.85;
      draw(step(0));
      return;
    }
    let last = performance.now();
    requestAnimationFrame(function frame(now) {
      if (myGeneration !== generation) return;
      draw(step(Math.min(0.05, (now - last) / 1000)));
      last = now;
      requestAnimationFrame(frame);
    });
  }

  // Style 16: drops on a window. Small still beads, and runners that slide down with a trail.
  function startPane(canvas, config, random, myGeneration, live, shared) {
    const context = canvas.getContext("2d");
    const bead = () => ({ x: random() * W, y: random() * H, r: 2 + random() * 7, red: random() < config.red * 0.4 });
    const beads = Array.from({ length: config.still }, bead);
    const runner = () => ({ x: random() * W, y: -random() * H, r: 7 + random() * 9, speed: 40 + random() * 160, wobble: random() * 10, red: random() < config.red, trail: [] });
    const runners = Array.from({ length: config.runners }, runner);
    let time = 0;

    function drawDrop(x, y, r, red) {
      const gradient = context.createRadialGradient(x - r * 0.3, y - r * 0.4, r * 0.1, x, y, r);
      gradient.addColorStop(0, red ? "rgba(255, 140, 140, .55)" : "rgba(255, 255, 255, .5)");
      gradient.addColorStop(0.6, red ? "rgba(229, 56, 59, .25)" : "rgba(200, 210, 220, .12)");
      gradient.addColorStop(1, "rgba(0, 0, 0, .35)");
      context.fillStyle = gradient;
      context.beginPath();
      context.ellipse(x, y, r * 0.85, r, 0, 0, Math.PI * 2);
      context.fill();
    }
    function step(seconds) {
      time += seconds;
      shared.advanceTime(seconds);
      const speedFactor = Number(chosen.speed);
      const active = Math.min(runners.length, Math.round(config.runners * Number(chosen.density)));
      for (let index = 0; index < active; index += 1) {
        const drop = runners[index];
        // A runner hesitates, then rushes: its speed pulses.
        drop.y += drop.speed * speedFactor * seconds * (0.4 + Math.abs(Math.sin(time * 1.3 + drop.wobble)));
        drop.x += Math.sin(time * 2 + drop.wobble) * 8 * seconds;
        if (random() < seconds * 6) drop.trail.push({ x: drop.x + (random() - 0.5) * 4, y: drop.y - drop.r, r: 1 + random() * 2.5 });
        if (drop.trail.length > 40) drop.trail.shift();
        if (drop.y - drop.r > H) Object.assign(drop, runner(), { y: -20 });
      }
      return active;
    }
    function draw(active) {
      context.clearRect(0, 0, W, H);
      shared.drawLightning();
      shared.floor();
      const beadCount = Math.round(config.still * Math.min(2, Number(chosen.density)));
      beads.slice(0, beadCount).forEach(drop => drawDrop(drop.x, drop.y, drop.r, drop.red));
      runners.slice(0, active).forEach(drop => {
        drop.trail.forEach(point => drawDrop(point.x, point.y, point.r, drop.red));
        drawDrop(drop.x, drop.y, drop.r, drop.red);
      });
    }
    if (!live) {
      for (let tick = 0; tick < 240; tick += 1) step(1 / 30);
      draw(step(0));
      return;
    }
    let last = performance.now();
    requestAnimationFrame(function frame(now) {
      if (myGeneration !== generation) return;
      draw(step(Math.min(0.05, (now - last) / 1000)));
      last = now;
      requestAnimationFrame(frame);
    });
  }

  // Blurred lights behind the window of style 16, one in four red.
  const bokeh = () => `<div class="ovl-bokeh" aria-hidden="true">${Array.from({ length: 16 }, (_, index) => {
    const size = 120 + ((index * 53) % 220);
    const red = index % 4 === 0;
    return `<i style="left:${(index * 331) % 2600}px; top:${(index * 211) % 1500}px; width:${size}px; height:${size}px; background:${red ? "#e5383b55" : "#ffffff1c"}"></i>`;
  }).join("")}</div>`;

  const stage = (word, content) => `<div class="ovl-screen"><div class="ovl-stage">${bokeh()}<canvas class="ovl-rain" width="2560" height="1440" data-word="${escape(word)}"></canvas>${content}</div></div>`;
  const pauseScreen = () => stage(T.pause.ghost, `
      <div class="ovl-content">
        <h1 class="ovl-title">${withSignalEnd(T.pause.title)}</h1>
        <p class="ovl-subtitle">${escape(T.pause.subtitle)}</p>
      </div>`);
  // The link of the tool sits in the footer, in red, just above the disclaimer that goes with it.
  const endScreen = () => stage(T.end.ghost, `
      <div class="ovl-content">
        <h1 class="ovl-title">${withSignalEnd(T.end.title)}</h1>
        <p class="ovl-subtitle">${escape(T.end.subtitle)}</p>
      </div>
      <div class="ovl-footer"><p class="ovl-footer-link">${escape(T.end.link)}</p><p class="ovl-footer-note">${escape(T.end.disclaimer)}</p></div>`);
  const frame = html => `<div class="page-frame">${html}</div>`;

  // Every scenario and state: [section title, [[label, html], …]], the newest section first.
  const SECTIONS = [
    ["Scenes", [
      ["« Pause »", frame(pauseScreen())],
      ["« Fin »", frame(endScreen())],
    ]],
  ];

  function applyVariables() {
    for (const [key, variant] of Object.entries(VARIANTS)) {
      if (variant.variable) document.documentElement.style.setProperty(variant.variable, chosen[key]);
    }
  }
  const keepInAddress = () => history.replaceState(null, "", "?" + new URLSearchParams(chosen));

  async function render() {
    generation += 1;
    for (const key of Object.keys(VARIANTS)) document.documentElement.dataset[key] = chosen[key];
    applyVariables();
    document.getElementById("tabs").innerHTML = Object.entries(VARIANTS).map(([key, variant]) => variant.range
      ? `<label class="group"><span>${variant.label}</span><input type="range" data-variant="${key}" min="${variant.range.min}" max="${variant.range.max}" step="${variant.range.step}" value="${chosen[key]}"><output>${chosen[key]}${variant.unit ?? ""}</output></label>`
      : variant.select
      ? `<label class="group"><span>${variant.label}</span><select data-variant="${key}">${Object.entries(variant.options).map(([value, label]) =>
        `<option value="${value}" ${chosen[key] === value ? "selected" : ""}>${label}</option>`).join("")}</select></label>`
      : `<div class="group"><span>${variant.label}</span>${Object.entries(variant.options).map(([value, label]) =>
        `<button type="button" data-variant="${key}" data-value="${value}" aria-pressed="${chosen[key] === value}">${label}</button>`).join("")}</div>`).join("");
    const theme = THEMES[chosen.theme];
    document.getElementById("sheet").innerHTML = `
      <header class="page-header"><h1>Rain ${theme.title}</h1><p>${theme.text} Lightning now and then, white or red; the floor still. Real texts, from overlays/screens/texts.js.</p></header>
      ${SECTIONS.map(([title, slots]) => `<section class="page-section"><h2>${title}</h2><div class="page-row">${
        slots.map(([label, html]) => `<div class="page-slot"><span>${label}</span>${html}</div>`).join("")}</div></section>`).join("")}`;
    // The giant word of the lightning is drawn in Manrope: wait for the font.
    await document.fonts.load("800 100px Manrope");
    document.querySelectorAll(".ovl-rain").forEach(canvas => startRain(canvas, canvas.dataset.word));
  }

  document.getElementById("tabs").addEventListener("click", event => {
    const { variant, value } = event.target.dataset;
    if (!variant || value === undefined) return;
    chosen[variant] = value;
    keepInAddress();
    render();
  });
  // A slider changes the rain at once (the engine reads it at each frame); a still frame is drawn again.
  document.getElementById("tabs").addEventListener("input", event => {
    const { variant } = event.target.dataset;
    if (!variant) return;
    chosen[variant] = event.target.value;
    if (VARIANTS[variant].range) event.target.nextElementSibling.value = chosen[variant] + (VARIANTS[variant].unit ?? "");
    keepInAddress();
    applyVariables();
    if (VARIANTS[variant].range && chosen.motion === "still") render();
  });
  document.getElementById("file-warning").hidden = location.protocol !== "file:";
  render();
</script>
</body>
</html>
